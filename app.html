  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

if>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display: flex; flex-wrap: wrap; gap: 5px;\">\n                    <sc-for list=\"{{ rm.people }}\" as=\"pp\" hint-placeholder-count=\"3\">\n                      <span sc-camel-on-click=\"{{ pp.open }}\" style=\"padding: 4px 9px; font-size: 12px; color: #4a4136; background: #f3ead7; border: 1px solid #e8dcc2; cursor: pointer;\" style-hover=\"border-color: #a8123f; color: #a8123f;\">{{ pp.name }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ rm.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; color: #a89468;\">Nobody assigned yet<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ rm.over }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top: 9px; padding: 6px 9px; font-size: 11.5px; color: #a8123f; background: #fbeef1; border: 1px solid #e2b8c4;\">{{ rm.overNote }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCheckin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 27px; margin: 0 0 4px;\">Arrivals desk<\u002Fdiv>\n        <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15.5px; line-height: 1.65; color: #6b6154; max-width: 640px; margin-bottom: 20px;\">{{ chkIntro }}<\u002Fdiv>\n\n        <div style=\"background: #fbf7ef; border: 1px solid #e3d5b8; padding: 16px 18px; margin-bottom: 18px;\">\n          <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px;\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 30px; color: #3f382d;\">{{ chkCount }}<\u002Fdiv>\n            <div style=\"font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; color: #8a6a2f;\">guests arrived<\u002Fdiv>\n            <div style=\"margin-left: auto; font-size: 12px; color: #6b6154;\">{{ chkRemain }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height: 7px; background: #f0e6d2; border: 1px solid #e3d5b8; margin-top: 11px;\">\n            <div style=\"height: 100%; background: #12c07a; box-shadow: 0 0 10px rgba(18, 192, 122, 0.6); width: {{ chkPct }};\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px;\">\n          <input type=\"text\" value=\"{{ chkQuery }}\" sc-camel-on-change=\"{{ onChkQuery }}\" placeholder=\"Find an arriving guest\" style=\"flex: 1 1 260px; min-width: 0; box-sizing: border-box; padding: 13px 15px; font-size: 15px; color: #3f382d; background: #fbf7ef; border: 1px solid #d8c294; outline: none;\" style-focus=\"border-color: #a8123f;\">\n          <sc-for list=\"{{ chkFilters }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <sc-if value=\"{{ c.active }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ c.pick }}\" style=\"padding: 11px 15px; font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: #fbf7ef; background: #3f382d; border: 1px solid #3f382d; cursor: pointer;\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ c.idle }}\" hint-placeholder-val=\"{{ true }}\">\n              <button sc-camel-on-click=\"{{ c.pick }}\" style=\"padding: 11px 15px; font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: #6b6154; background: transparent; border: 1px solid #ddc9a0; cursor: pointer;\" style-hover=\"border-color: #a8123f; color: #a8123f;\">{{ c.label }}<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ chkEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 26px 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: #6b6154;\">{{ chkEmptyNote }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ chkParties }}\" as=\"cp\" hint-placeholder-count=\"6\">\n          <div style=\"background: #fbf7ef; border: 1px solid #e3d5b8; margin-bottom: 12px;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 15px; border-bottom: 1px solid #f0e6d2; background: #f7f2e8;\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6b5a33;\">{{ cp.pad }}<\u002Fspan>\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px;\">{{ cp.lead }}<\u002Fspan>\n              <span style=\"font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #8a6a2f;\">{{ cp.meta }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ cp.all }}\" style=\"margin-left: auto; padding: 9px 14px; font-family: 'Karla', sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; cursor: pointer; color: #3f382d; background: #f0e6d2; border: 1px solid #c9ab6f;\" style-hover=\"border-color: #a8123f; color: #a8123f;\">{{ cp.allLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ cp.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding: 9px 15px; font-size: 12.5px; line-height: 1.55; color: #6b5a33; background: #fdf8ec; border-bottom: 1px solid #f0e6d2;\">{{ cp.note }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ cp.showWay }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding: 11px 15px; border-bottom: 1px solid #f0e6d2; background: #fdf8ec;\">\n                <div style=\"font-size: 13.5px; font-weight: 600; line-height: 1.4; color: #3f382d;\">{{ cp.wing }}<\u002Fdiv>\n                <div style=\"font-size: 12.5px; line-height: 1.55; color: #6b5a33; margin-top: 2px;\">{{ cp.directions }}<\u002Fdiv>\n                <sc-if value=\"{{ cp.hasOthers }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top: 9px; padding-top: 8px; border-top: 1px solid #f0e6d2;\">\n                    <div style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8a6a2f; margin-bottom: 4px;\">Also sharing the room<\u002Fdiv>\n                    <sc-for list=\"{{ cp.others }}\" as=\"o\" hint-placeholder-count=\"2\">\n                      <div style=\"font-size: 13px; line-height: 1.6; color: #4a4136;\">{{ o.name }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-for list=\"{{ cp.guests }}\" as=\"g\" hint-placeholder-count=\"2\">\n              <div sc-camel-on-click=\"{{ g.toggle }}\" style=\"display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 9px 15px; border-bottom: 1px solid #f7f2e8; cursor: pointer;\" style-hover=\"background: #fffdf8;\">\n                <sc-if value=\"{{ g.arrived }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"flex: 0 0 28px; height: 28px; display: grid; place-items: center; font-size: 15px; color: #0a6b47; background: #eafaf1; border: 1px solid #12c07a; box-shadow: 0 0 10px rgba(18, 192, 122, 0.45);\">✓<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ g.waiting }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"flex: 0 0 28px; height: 28px; background: #fff; border: 1px solid #ddc9a0;\"><\u002Fspan>\n                <\u002Fsc-if>\n                <span style=\"flex: 1 1 auto; min-width: 0; font-size: 17px; color: #3f382d;\">{{ g.name }}<\u002Fspan>\n                <span style=\"font-size: 12px; color: #6b6154; text-align: right; white-space: nowrap;\">{{ g.room }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isHealth }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 27px; margin: 0 0 4px;\">What needs attention<\u002Fdiv>\n        <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15.5px; line-height: 1.65; color: #6b6154; max-width: 640px; margin-bottom: 20px;\">Everything the guest list can't resolve on its own — missing contacts, rooms that don't add up, names that appear twice.<\u002Fdiv>\n\n        <sc-if value=\"{{ healthClean }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: #fbf7ef; border: 1px solid #e3d5b8; padding: 22px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #0a6b47;\">Nothing to fix. Every party has a contact, every room adds up.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ healthGroups }}\" as=\"hg\" hint-placeholder-count=\"3\">\n          <div style=\"background: #fbf7ef; border: 1px solid #e3d5b8; margin-bottom: 14px;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; padding: 13px 16px; border-bottom: 1px solid #f0e6d2;\">\n              <sc-if value=\"{{ hg.bad }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"width: 7px; height: 7px; background: #a8123f; transform: rotate(45deg);\"><\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ hg.warn }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"width: 7px; height: 7px; background: #c9ab6f; transform: rotate(45deg);\"><\u002Fspan>\n              <\u002Fsc-if>\n              <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 20px;\">{{ hg.title }}<\u002Fspan>\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8a6a2f;\">{{ hg.count }}<\u002Fspan>\n              <span style=\"flex: 1 1 200px; min-width: 0; font-size: 12.5px; line-height: 1.5; color: #6b6154;\">{{ hg.why }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ hg.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ it.open }}\" style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 10px 16px; border-bottom: 1px solid #f7f2e8; cursor: pointer;\" style-hover=\"background: #fffdf8;\">\n                <span style=\"font-size: 14px; color: #3f382d;\">{{ it.label }}<\u002Fspan>\n                <span style=\"font-size: 12px; color: #6b6154;\">{{ it.sub }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSheet }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 27px; margin: 0 0 4px;\">From the Google sheet<\u002Fdiv>\n        <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15.5px; line-height: 1.65; color: #6b6154; max-width: 640px; margin-bottom: 20px;\">Add a guest to the shared sheet and they appear here. Accept them and they land on the desk on every device. Edits made on the desk are never overwritten by the sheet — the sheet only ever brings new names.<\u002Fdiv>\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 18px;\">\n          <button sc-camel-on-click=\"{{ sheetRefresh }}\" style=\"padding: 10px 15px; font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: #fbf7ef; background: #3f382d; border: 1px solid #3f382d; cursor: pointer;\" style-hover=\"background: #a8123f; border-color: #a8123f;\">{{ sheetRefreshLabel }}<\u002Fbutton>\n          <a href=\"{{ sheetLink }}\" target=\"_blank\" rel=\"noopener\" style=\"padding: 10px 15px; font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: #3f382d; background: transparent; border: 1px solid #c9ab6f;\" style-hover=\"border-color: #a8123f; color: #a8123f; text-decoration: none;\">Open the sheet<\u002Fa>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8a6a2f;\">{{ sheetWhen }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ sheetJustShow }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: #eafaf1; border: 1px solid #12c07a; padding: 13px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.5; color: #0a6b47;\">{{ sheetJustLabel }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ sheetHasNew }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background: #fbf7ef; border: 1px solid #e3d5b8; margin-bottom: 18px;\">\n            <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 13px 16px; border-bottom: 1px solid #f0e6d2;\">\n              <span style=\"width: 7px; height: 7px; background: #c9ab6f; transform: rotate(45deg);\"><\u002Fspan>\n              <span style=\"flex: 1 1 240px; min-width: 0; font-family: 'Cormorant Garamond', serif; font-size: 20px;\">{{ sheetHeadline }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ sheetAddAll }}\" style=\"padding: 9px 14px; font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: #fbf7ef; background: #3f382d; border: 1px solid #3f382d; cursor: pointer;\" style-hover=\"background: #a8123f; border-color: #a8123f;\">{{ sheetAddLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-for list=\"{{ sheetNewRows }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 10px 16px; border-bottom: 1px solid #f7f2e8;\">\n                <span style=\"font-size: 14px; color: #3f382d;\">{{ s.name }}<\u002Fspan>\n                <span style=\"font-size: 12px; color: #6b6154;\">{{ s.sub }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ sheetClean }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: #fbf7ef; border: 1px solid #e3d5b8; padding: 22px; margin-bottom: 18px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #0a6b47;\">The desk has everyone the sheet has.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ sheetHasErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background: #fbeef1; border: 1px solid #e2b8c4; padding: 16px; margin-bottom: 18px; display: flex; align-items: baseline; gap: 10px;\">\n            <span style=\"width: 5px; height: 5px; background: #a8123f; transform: rotate(45deg); flex-shrink: 0; margin-top: 6px;\"><\u002Fspan>\n            <span style=\"font-size: 13px; line-height: 1.55; color: #a8123f;\">{{ sheetErr }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"background: #fbf7ef; border: 1px solid #e3d5b8; padding: 16px; margin-bottom: 18px;\">\n          <div style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8a6a2f;\">Paste the rows instead<\u002Fdiv>\n          <div style=\"font-size: 12.5px; line-height: 1.6; color: #6b6154; margin: 5px 0 9px;\">Always works, even with no signal and even if the sheet is private: in Google Sheets select everything, copy, and drop it below. Commas or tabs, either way.<\u002Fdiv>\n          <textarea value=\"{{ sheetPaste }}\" sc-camel-on-input=\"{{ sheetPasteSet }}\" placeholder=\"Name, Party, Phone, Email, Room, City\" style=\"width: 100%; min-height: 90px; box-sizing: border-box; padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3f382d; background: #fffdf8; border: 1px solid #e3d5b8; resize: vertical;\"><\u002Ftextarea>\n          <button sc-camel-on-click=\"{{ sheetPasteRead }}\" style=\"margin-top: 10px; padding: 9px 14px; font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: #3f382d; background: transparent; border: 1px solid #c9ab6f; cursor: pointer;\" style-hover=\"border-color: #a8123f; color: #a8123f;\">Read what I pasted<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 16px; background: #fbf7ef; border: 1px solid #e3d5b8;\">\n          <div style=\"flex: 1 1 260px; min-width: 0;\">\n            <div style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8a6a2f;\">Add new rows without asking<\u002Fdiv>\n            <div style=\"font-size: 12.5px; line-height: 1.55; color: #6b6154; margin-top: 4px;\">On this device only. With it on, a guest added to the sheet is on the desk the next time the desk is opened or refreshed.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ sheetAutoOff }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ sheetAutoToggle }}\" style=\"padding: 9px 14px; font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: #3f382d; background: transparent; border: 1px solid #c9ab6f; cursor: pointer;\" style-hover=\"border-color: #a8123f; color: #a8123f;\">Off · turn on<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ sheetAutoOn }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ sheetAutoToggle }}\" style=\"padding: 9px 14px; font-family: 'Karla', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: #fbf7ef; background: #0a6b47; border: 1px solid #0a6b47; cursor: pointer;\" style-hover=\"background: #a8123f; border-color: #a8123f;\">On · turn off<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-for list=\"{{ results }}\" as=\"p\" hint-placeholder-count=\"1\">\n      <div style=\"margin-bottom: 44px;\">\n\n        <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding-bottom: 12px; border-bottom: 1px solid #ddc9a0; margin-bottom: 18px;\">\n          <sc-if value=\"{{ p.notSent }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px; color: #a8123f; padding: 5px 10px; border: 1px solid #e3d5b8; background: #fbf7ef;\">{{ p.flight }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ p.isSent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; align-items: center; gap: 8px; padding: 5px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 1px; border: 1px solid #12c07a; background: #eafaf1; color: #0a6b47; box-shadow: 0 0 0 1px rgba(18, 192, 122, 0.28), 0 0 12px rgba(18, 192, 122, 0.5), inset 0 0 8px rgba(18, 192, 122, 0.12);\">\n              <span style=\"width: 6px; height: 6px; border-radius: 50%; background: #12c07a; box-shadow: 0 0 7px rgba(18, 192, 122, 0.95);\"><\u002Fspan>{{ p.flight }} · SENT\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 27px; line-height: 1.1;\">{{ p.lead }}<\u002Fdiv>\n          <div style=\"font-size: 11.5px; letter-spacing: 1.4px; text-transform: uppercase; color: #8a6a2f;\">{{ p.sizeLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; flex-wrap: wrap; gap: 14px 26px; align-items: center; padding: 14px 16px; background: #fbf7ef; border: 1px solid #e3d5b8; margin-bottom: 20px;\">\n          <div style=\"min-width: 0;\">\n            <div style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8a6a2f;\">Primary contact<\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; margin-top: 4px;\">{{ p.phoneLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"min-width: 0; max-width: 100%;\">\n            <div style=\"font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #8a6a2f;\">Email<\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; margin-top: 4px; overflow-wrap: anywhere;\">{{ p.emailLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto;\">\n            <sc-if value=\"{{ p.noContact }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; align-items: center; gap: 9px; padding: 9px 13px; background: #fbeef1; border: 1px solid #e2b8c4;\">\n                <span style=\"width: 5px; height: 5px; background: #a8123f; transform: rotate(45deg); flex-shrink: 0;\"><\u002Fspan>\n                <span style=\"font-size: 12px; line-height: 1.5; color: #a8123f;\">No phone or email on file — nothing to send. Add one with <strong>Edit<\u002Fstrong>.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ p.hasPhone }}\" hint-placeholder-val=\"{{ true }}\">\n              <a href=\"{{ p.waHref }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ p.markWaSent }}\" style=\"padding: 10px , '', 'sandeepadukia@hotmail.com', [['Sandeep Adukia', 'SGL', 'YYZ'], ['Priti Adukia', 'SGL', 'YYZ']]],\n  [24, 'Jayaraman Venkatarao', '1-647-295-3784', 'jayaraman35@hotmail.com', [['Jayaraman Venkatarao', 'SGL', 'YYZ'], ['Vidhya Krishnamoorthy', 'SGL', 'YYZ']]],\n  [25, 'Mahadevan Balasundaram', '+1 647-637-3627', 'jayanthi.mahadevan@gmail.com', [['Mahadevan Balasundaram (Madhava Puri Das)', 'SGL', 'YYZ']]],\n  [26, 'Uma Krishna (Ujwala)', '9055982082', 'reddy_u@yahoo.com', [['Uma Krishna (Ujwala)', 'DBL', 'YYZ']]],\n  [27, 'Narendra Gadhamsetty', '469-670-6027', 'naraharidev@gmail.com', [['Narendra Gadhamsetty', 'SGL', 'YYZ']]],\n  [28, 'Indulekha Premamayi DD', '6472001142', 'indulekha872@gmail.com', [['Indulekha Premamayi DD', 'DBL', 'YYZ']]],\n  [29, 'Sanatana Sevak das', '647 938 1728', 'Sureshrao1728@hotmail.ca', [['Sanatana Sevak das', 'TMP', 'YYZ'], ['Kamala Gopi dd', 'TMP', 'YYZ']]],\n  [30, 'Mahavishnu das', '6479666175', 'mmendon@hotmail.com', [['Mahavishnu das', 'TMP', 'YYZ'], ['Pramila Mendon', 'TMP', 'YYZ']]],\n  [31, 'Dharma Das', '647 892 0739', 'dharandev58@gmail.com', [['Dharma Das', 'TMP', 'YYZ'], ['Manasi Ganga dd', 'TMP', 'YYZ']]],\n  [32, 'Bhavita Panchal', '6477062618', 'chiman.panchal@yahoo.com', [['Bhavita Panchal', 'TMP', 'YYZ'], ['Chiman Panchal', 'TMP', 'YYZ'], ['Bhagyashree Panchal', 'TMP', 'YYZ']]],\n  [33, 'Saiprasad Meda', '6477206481', 'sunithabartaki@gmail.com', [['Saiprasad Meda', 'TMP', 'YYZ'], ['Sacimata Devi Dasi', 'TMP', 'YYZ'], ['Abhinav Meda', 'CAB', 'YYZ'], ['Lakshmipriya Meda', 'TMP', 'YYZ']]],\n  [34, 'Bhavamalini', '6477060862', 'bunasrig@gmail.com', [['Bhavamalini', 'GF', 'YYZ'], ['Shri Krsna Sharan Das', 'GF', 'YYZ'], ['Nandhasuta Prabhu', 'GF', 'YYZ'], ['Bhuvana Pujitha Mtg', 'GF', 'YYZ']]],\n  [35, 'Bhanuja', '', '', [['Bhanuja', 'DBL', 'YYZ']]],\n  [36, 'Chakradhar Bandla', '+1 213-551-3694', 'bandlachakradhar@gmail.com', [['Chakradhar Bandla', 'GF', 'YYZ']]],\n  [37, 'Photographers', '', '', [['Photographers', 'DBL', 'YYZ'], ['Photographers, guest 2', 'DBL', 'YYZ'], ['Photographers, guest 3', 'DBL', 'YYZ']]],\n  [38, 'Neetu & Sumith', '', '', [['Neetu', 'DBL', 'YYZ'], ['Sumith', 'DBL', 'YYZ'], ['Udyat', 'DBL', 'YYZ'], ['Vihan', 'DBL', 'YYZ']]],\n  [39, 'Paul Arvind Joseph', '', '', [['Paul Arvind Joseph', 'SGL', 'YYZ'], ['Chitra Arvind Joseph', 'SGL', 'YYZ']]],\n  [40, 'Ankush Koshal', '', 'ankushkoshal10@gmail.com', [['Ankush Koshal', 'CAB', 'YYZ']]],\n  [42, 'Venkatesh', '', '', [['Venkatesh', 'SGL', 'YYZ'], ['Soumya', 'SGL', 'YYZ']]],\n  [43, 'Prabhudev & Suma', '', '', [['Prabhudev Ramachandra', 'APT', 'YYZ'], ['Suma Prabhudev', 'APT', 'YYZ']]],\n  [44, 'Abhishek & Rebecca', '', '', [['Abhishek Prabhudev', 'CAB', 'YYZ'], ['Rebecca Horst', 'CAB', 'YYZ']]]\n];\n\nconst HIDDEN = { 43: true, 44: true };\n\nconst ROOM_OPTIONS = [{ v: '', label: '\\u2014 no room yet \\u2014' }].concat(ROOMLIST.map(r => ({ v: r[0], label: r[0] + '  \\u00b7  ' + ROOMS[r[1]].label })));\nconst TYPE_OPTIONS = Object.keys(ROOMS).map(c => ({ v: c, label: ROOMS[c].label }));\nconst ORIGIN_OPTIONS = Object.keys(CITIES).map(c => ({ v: c, label: c + '  \\u00b7  ' + CITIES[c] }));\n\nconst pad2 = n => (n < 10 ? '0' + n : '' + n);\nconst digits = s => (s || '').replace(/[^0-9]/g, '');\nconst waNumber = s => { const d = digits(s); if (!d) return ''; return d.length === 10 ? '1' + d : d; };\nconst slug = s => (s || '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');\n\nconst SENT_KEY = 'ar-boarding-sent-v1';\nconst ACK_KEY = 'ar-rsvp-acked-v1';\nconst NOTE_KEY = 'ar-party-notes-v1';\nconst CHK_KEY = 'ar-checkin-v1';\nconst OV_KEY = 'ar-guest-overrides-v1';\n// Rooms beyond the fixed sheet (it stops at GF-06) live here.\nconst RM_KEY = 'ar-extra-rooms-v1';\nconst WA_HOST = '16474672204';\n\n// ---- The shared Google sheet --------------------------------------------\n// The sheet is where the list is actually kept up to date, so the desk reads\n// it (through /sheet on the server, which sidesteps CORS) and offers anything\n// new as a party to accept. Nothing is ever written back to the sheet, and\n// nothing lands on the desk until it is accepted — unless the auto switch is\n// on, which is per device.\nconst SHEET_ID = '1eLrBCxfGjcFMWGkuikaXI5tuIzO6BWIpBDo2aGxfIT4';\nconst SHEET_LINK = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit';\nconst SHEET_CSV = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv';\nconst SHEET_AUTO_KEY = 'ar-sheet-auto-v1';\n\nconst csvParse = text => {\n  // A CSV straight from Google starts with a byte-order mark, which would\n  // otherwise glue itself to the first heading and hide that column.\n  const s = String(text || '').replace(/^\\uFEFF/, '').replace(/\\r\\n/g, '\\n').replace(/\\r/g, '\\n');\n  // Copied straight out of Google Sheets the columns arrive tab-separated;\n  // downloaded or fetched they arrive comma-separated.\n  const head = s.split('\\n')[0] || '';\n  const delim = (head.split('\\t').length > head.split(',').length) ? '\\t' : ',';\n  const rows = [];\n  let row = [], cell = '', quoted = false;\n  for (let i = 0; i < s.length; i++) {\n    const c = s[i];\n    if (quoted) {\n      if (c === '\"') { if (s[i + 1] === '\"') { cell += '\"'; i++; } else quoted = false; }\n      else cell += c;\n    } else if (c === '\"') quoted = true;\n    else if (c === delim) { row.push(cell); cell = ''; }\n    else if (c === '\\n') { row.push(cell); rows.push(row); row = []; cell = ''; }\n    else cell += c;\n  }\n  row.push(cell); rows.push(row);\n  // Blank rows are kept, tagged with the line they came from, so \"sheet row 12\"\n  // still points at row 12 in Google Sheets when the sheet has gaps in it.\n  rows.forEach((r, i) => { r.line = i + 1; });\n  return rows;\n};\n\nconst rowEmpty = r => !r.some(v => (v || '').trim() !== '');\n\n// Column names are whatever the sheet happens to use, so match on exact\n// header first, then on a header that merely contains the word.\nconst colIdx = (heads, cands) => {\n  for (let i = 0; i < cands.length; i++) {\n    const hit = heads.indexOf(cands[i]);\n    if (hit !== -1) return hit;\n  }\n  for (let i = 0; i < cands.length; i++) {\n    for (let j = 0; j < heads.length; j++) if (heads[j].indexOf(cands[i]) !== -1) return j;\n  }\n  return -1;\n};\n\nconst ROOM_IDS = {};\nROOMLIST.forEach(r => { ROOM_IDS[r[0].toUpperCase()] = r[0]; });\n\nconst normRoomId = v => {\n  const t = (v || '').trim().toUpperCase().replace(/\\s+/g, '');\n  if (!t) return '';\n  if (ROOM_IDS[t]) return ROOM_IDS[t];\n  const m = /^([A-Z]{2,4})-?(\\d{1,3})$/.exec(t);\n  if (!m) return '';\n  const id = m[1] + '-' + (m[2].length === 1 ? '0' + m[2] : m[2]);\n  return ROOM_IDS[id] || id;\n};\n\nconst normType = (v, roomId) => {\n  const raw = (v || '').trim();\n  const up = raw.toUpperCase();\n  if (ROOMS[up]) return up;\n  const byLabel = Object.keys(ROOMS).filter(c => ROOMS[c].label.toLowerCase() === raw.toLowerCase())[0];\n  if (byLabel) return byLabel;\n  const pre = (roomId || '').split('-')[0];\n  return ROOMS[pre] ? pre : 'DBL';\n};\n\n// An origin we don't have a city for would render as a blank airport code, so\n// anything unrecognised falls back to Toronto.\nconst normCity = v => {\n  const raw = (v || '').trim();\n  if (!raw) return 'YYZ';\n  const up = raw.toUpperCase();\n  if (CITIES[up]) return up;\n  const hit = Object.keys(CITIES).filter(c => CITIES[c].toLowerCase().indexOf(raw.toLowerCase()) !== -1)[0];\n  return hit || 'YYZ';\n};\n\nconst H_NAME = ['guest name', 'full name', 'name', 'guest', 'guests'];\nconst H_PARTY = ['party', 'group', 'family', 'household', 'invite'];\nconst H_PHONE = ['phone', 'mobile', 'whatsapp', 'cell', 'number'];\nconst H_MAIL = ['email', 'e-mail'];\nconst H_ROOM = ['room no', 'room #', 'room'];\nconst H_TYPE = ['room type', 'accommodation', 'lodging', 'type'];\nconst H_CITY = ['flying from', 'origin', 'city', 'from'];\nconst H_ALL = [H_NAME, H_PARTY, H_PHONE, H_MAIL, H_ROOM, H_TYPE, H_CITY];\n\nconst sheetParties = text => {\n  const rows = csvParse(text);\n  if (rows.filter(r => !rowEmpty(r)).length < 2) return { error: 'The sheet came back with no rows under its headings.', parties: [] };\n  // Sheets open with a title row, a blank row, or both. Rather than trust the\n  // first row, score the first few and take whichever looks most like\n  // headings — a title like \"Wedding guest list\" happens to contain the word\n  // guest, but it won't also have party, room and city next to it.\n  let best = null;\n  for (let k = 0; k < Math.min(8, rows.length - 1); k++) {\n    const h = rows[k].map(x => (x || '').trim().toLowerCase());\n    const i = colIdx(h, H_NAME);\n    if (i === -1) continue;\n    const score = H_ALL.reduce((s, g) => s + (colIdx(h, g) !== -1 ? 1 : 0), 0);\n    if (!best || score > best.score) best = { hi: k, heads: h, iName: i, score: score };\n  }\n  if (!best) return { error: 'None of the first rows of the sheet have a Name column, so the desk cannot tell which column holds guests. Name the column Name or Guest name.', parties: [] };\n  const hi = best.hi, heads = best.heads, iName = best.iName;\n  const iParty = colIdx(heads, H_PARTY);\n  const iPhone = colIdx(heads, H_PHONE);\n  const iMail = colIdx(heads, H_MAIL);\n  const iRoom = colIdx(heads, H_ROOM);\n  const iType = colIdx(heads, H_TYPE);\n  const iCity = colIdx(heads, H_CITY);\n  const out = [], by = {}, seenName = {};\n  rows.slice(hi + 1).forEach(r => {\n    if (rowEmpty(r)) return;\n    const line = r.line || 0;\n    // A cell can hold line breaks and runs of spaces; a name carrying either\n    // would never match the same person on the desk.\n    const cell = i => (i === -1 ? '' : String(r[i] || '').replace(/\\s+/g, ' ').trim());\n    const name = cell(iName).slice(0, 70);\n    // Sheets collect totals rows, spacer rows and notes. A name with no\n    // letters, or one of those words on its own, is not a guest.\n    if (!name || !/[A-Za-z\\u00C0-\\u024F]/.test(name)) return;\n    if (/^(name|guest|guests|total|totals|sum|count|notes?|tbd|n\\/a|none|\\u2014|-)$/i.test(name)) return;\n    // The same name twice in the sheet is one guest, not two.\n    if (seenName[name.toLowerCase()]) return;\n    seenName[name.toLowerCase()] = true;\n    const roomId = normRoomId(cell(iRoom));\n    // A sheet with one Room column often puts a type word (\"Cabin\") there\n    // rather than a number, so that cell stands in for the type column too.\n    const mem = { name: name, roomId: roomId, code: normType(cell(iType) || cell(iRoom), roomId), origin: normCity(cell(iCity)), row: line };\n    const lead = cell(iParty) || name;\n    const key = lead.toLowerCase();\n    if (by[key]) {\n      by[key].members.push(mem);\n      if (!by[key].phone) by[key].phone = cell(iPhone);\n      if (!by[key].email) by[key].email = cell(iMail);\n    } else {\n      by[key] = { key: key, lead: lead, phone: cell(iPhone), email: cell(iMail), members: [mem], row: line };\n      out.push(by[key]);\n    }\n  });\n  return { parties: out, grouped: iParty !== -1 };\n};\n\nconst sheetFetch = () => {\n  // Same-origin first: on the deployed desk that is the only route that works\n  // without Google's blessing. The direct CSV is the fallback for running the\n  // file locally.\n  const tryOne = url => fetch(url, { cache: 'no-store' }).then(res => {\n    if (!res.ok) {\n      if (url !== SHEET_CSV && res.status === 404) throw new Error('This copy of the desk has no sheet reader \\u2014 /sheet only exists on the deployed site. Paste the rows in below instead.');\n      throw new Error('The sheet answered ' + res.status + '.');\n    }\n    return res.text().then(body => {\n      if (url !== SHEET_CSV) {\n        let j = null;\n        try { j = JSON.parse(body); } catch (e) { j = null; }\n        if (j && j.ok && j.csv) return { csv: j.csv };\n        throw new Error((j && j.error) || 'The desk could not read the sheet.');\n      }\n      if (/^\\s*<\u002F.test(body)) throw new Error('Googl
