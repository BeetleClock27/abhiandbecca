document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n    <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <section data-screen-label=\"Hero\" data-rt-hero=\"\" style=\"padding: 116px 24px 30px; text-align: center;\">\n    <svg width=\"70\" height=\"20\" sc-camel-view-box=\"0 0 70 20\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" style=\"display: block; margin: 0 auto 16px;\"><path d=\"M5,10 Q35,0 65,10\" fill=\"none\" stroke=\"#ddc9a0\" stroke-width=\"1.5\"><\u002Fpath><ellipse cx=\"20\" cy=\"7\" rx=\"3\" ry=\"1.6\" fill=\"#ddc9a0\" transform=\"rotate(-20 20 7)\"><\u002Fellipse><ellipse cx=\"35\" cy=\"4\" rx=\"3.4\" ry=\"1.8\" fill=\"#ddc9a0\"><\u002Fellipse><ellipse cx=\"50\" cy=\"7\" rx=\"3\" ry=\"1.6\" fill=\"#ddc9a0\" transform=\"rotate(20 50 7)\"><\u002Fellipse><\u002Fsvg>\n    <div style=\"font-size: 13px; letter-spacing: 2.4px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 14px;\">A Madhva Sampradaya Wedding<\u002Fdiv>\n    <h1 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(40px, 9.6vw, 96px); line-height: 1.02; margin: 0 auto 20px; max-width: 15ch; letter-spacing: -1px; text-wrap: balance; text-shadow: 0 1px 3px oklch(38% 0.02 70 / 0.12), 0 0 26px oklch(74% 0.09 83 / 0.4);\">Wedding Rituals, In Sequence<\u002Fh1>\n    <p style=\"max-width: 640px; margin: 0 auto 12px; font-size: 17.5px; line-height: 1.8; color: oklch(46% 0.02 70); text-wrap: pretty;\">Twenty rituals, about three hours, in the order they happen, and what each one is for. There is no baraat and no sangeet. It is a morning of small, exact acts, and every one of them has a job to do. The purohit explains each step in English as he goes, so you can just turn up and listen. This is here in case you would rather know beforehand.<\u002Fp>\n    <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: oklch(58% 0.09 80); margin: 0;\">Tulalagna Muhurta · 9:15 AM to noon · Yoga Shala, New Vrindaban<\u002Fp>\n    <p style=\"font-size: 13.5px; line-height: 1.7; color: oklch(62% 0.015 70); margin: 10px auto 0; max-width: 540px;\">Times below are approximate. The purohit keeps the muhurta, not the clock.<\u002Fp>\n    <div class=\"rt-stage\" data-ritual-object=\"kalash\" style=\"max-width: 640px; margin: 4px auto 0;\"><\u002Fdiv>\n    <div style=\"font-size: 11.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">The objects here turn — drag them<\u002Fdiv>\n    <div style=\"margin: 24px auto 0; width: 1px; height: 46px; background: linear-gradient(oklch(84% 0.02 80), transparent); animation: rt-cue 2.6s ease-in-out infinite;\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Three moments\" style=\"padding: 6px 24px 0;\">\n    <div style=\"max-width: 920px; margin: 0 auto; border: 1px solid oklch(91% 0.012 80); border-radius: 4px; padding: 24px 28px 26px;\">\n      <div style=\"font-size: 11.5px; letter-spacing: 1.8px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 16px;\">If you only follow three moments<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px 32px;\">\n        <div>\n          <div style=\"font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">04 · The funny one<\u002Fdiv>\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 26px; line-height: 1.15; margin-bottom: 6px;\"><a href=\"#r4\">Kashi Yatra<\u002Fa><\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.65; color: oklch(50% 0.015 70);\">Abhi walks out of his own wedding to become a monk and has to be talked back in.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">09 · Do not miss<\u002Fdiv>\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 26px; line-height: 1.15; margin-bottom: 6px;\"><a href=\"#r9\">Jeelakarra Bellam<\u002Fa><\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.65; color: oklch(50% 0.015 70);\">Cumin and jaggery, the curtain down. This is the second we are married.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">19 · Your part<\u002Fdiv>\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 26px; line-height: 1.15; margin-bottom: 6px;\"><a href=\"#r19\">Ashirvadamu<\u002Fa><\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.65; color: oklch(50% 0.015 70);\">Take a pinch of rice, say our names, throw it gently. No queue, no order.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div data-act=\"\" style=\"max-width: 1160px; margin: 0 auto; padding: 46px 24px 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px;\">\n    <span style=\"flex: none; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">Act I<\u002Fspan>\n    <span style=\"flex: none; font-family: 'Cormorant Garamond', serif; font-size: clamp(22px, 3.2vw, 30px);\">Before the ceremony<\u002Fspan>\n    <span style=\"flex: 1 1 40px; height: 1px; background: oklch(89% 0.02 82);\"><\u002Fspan>\n    <span style=\"flex: none; font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: oklch(62% 0.015 70); font-weight: 600;\">Dawn to about 9:15<\u002Fspan>\n  <\u002Fdiv>\n\n  <section id=\"r1\" data-screen-label=\"01 Mangala Snanam\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"snanam\" style=\"order: 1;\"><\u002Fdiv>\n        <div style=\"order: 2;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">01<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">Dawn, in private<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 40 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Mangala Snanam<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">The auspicious bath<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(50% 0.015 70); margin: 0 0 18px; text-wrap: pretty;\">The wedding day begins with this. Rebecca and I are each bathed at dawn in turmeric, oil and sandalwood, separately, in our own rooms, before any of you are awake.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Nobody goes into the rites unwashed. It cleans you, and it draws a line under the night before.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Nothing. This one is not for guests. You will see the turmeric on our skin later and that is all.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 5px;\">Abhi<\u002Fdiv>\n            <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.62; color: oklch(46% 0.02 70); margin: 0; text-wrap: pretty;\">It happens before the sun is properly over the ridge, in separate rooms, with far too many relatives supervising. I have been told I will not be allowed to rush it.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r2\" data-screen-label=\"02 Gauri Puja\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"gauri\" style=\"order: 1;\"><\u002Fdiv>\n        <div style=\"order: 2;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">02<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">The last thing done alone<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 20 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Gauri Puja<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">The bride’s prayer, and the Pravara<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(50% 0.015 70); margin: 0 0 18px; text-wrap: pretty;\">Rebecca offers her prayers to Gauri, who is Parvati, for strength and for company. I finish my own puja nearby. During this the purohit also performs the Pravara, the naming that brings her into our line.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Gauri is the goddess of marriage kept steady over a long life, so the bride asks her first, alone, before anything is shared. Married couples from the family stand in as witnesses to the Pravara.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The small turmeric figure on the leaf. Gauri is shaped by hand that morning, and she is not meant to be neat.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 5px;\">Becca<\u002Fdiv>\n            <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.62; color: oklch(46% 0.02 70); margin: 0; text-wrap: pretty;\">Nobody minds that she comes out lopsided. That was the first bit of all this that made sense to me straight away.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r3\" data-screen-label=\"03 Vara Puja\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"varapuja\" style=\"order: 2;\"><\u002Fdiv>\n        <div style=\"order: 1;\">\n          <div>\n            <div>\n              <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n                <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">03<\u002Fspan>\n                <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">At the door<\u002Fspan>\n                <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 10 min<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Vara Puja<\u002Fh2>\n              <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">The groom is received<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 16px; line-height: 1.8; color: oklch(50% 0.015 70); margin: 0 0 14px; text-wrap: pretty;\">The party walking in with me is met at the entrance, and we all come in together, with music.<\u002Fp>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px; margin-bottom: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">My side is not meant to simply walk in. They are met at the door and brought in properly. After that, nobody in the room is a guest or a host.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The lamps on the plate at the door, and the drums. If you hear reed pipes starting up outside, that is us arriving.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r4\" data-screen-label=\"04 Kashi Yatra\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"kashiyatra\" style=\"order: 1;\"><\u002Fdiv>\n        <div style=\"order: 2;\">\n          <div>\n            <div>\n              <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n                <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">04<\u002Fspan>\n                <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">The funny one<\u002Fspan>\n                <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 10 min<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Kashi Yatra<\u002Fh2>\n              <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">The walk to Varanasi<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 16px; line-height: 1.8; color: oklch(50% 0.015 70); margin: 0 0 14px; text-wrap: pretty;\">I announce that I have thought better of all this and am leaving on foot for Kashi to become a monk. I take an umbrella, a stick and sandals. My uncle catches me and talks me out of it.<\u002Fp>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px; margin-bottom: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">A man about to marry has two roads open to him. He can give up the world, or he can keep a house. The ritual turns that into a joke and makes him choose the house out loud, in front of everyone, on his own two feet.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 5px;\">Abhi<\u002Fdiv>\n                <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; line-height: 1.6; color: oklch(46% 0.02 70); margin: 0; text-wrap: pretty;\">I will be walking out of my own wedding holding an umbrella. My uncle has exactly one job that morning and I am counting on him.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div data-act=\"\" style=\"max-width: 1160px; margin: 0 auto; padding: 46px 24px 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px;\">\n    <span style=\"flex: none; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">Act II<\u002Fspan>\n    <span style=\"flex: none; font-family: 'Cormorant Garamond', serif; font-size: clamp(22px, 3.2vw, 30px);\">At the mandapam<\u002Fspan>\n    <span style=\"flex: 1 1 40px; height: 1px; background: oklch(89% 0.02 82);\"><\u002Fspan>\n    <span style=\"flex: none; font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: oklch(62% 0.015 70); font-weight: 600;\">About 9:15 to 10:15<\u002Fspan>\n  <\u002Fdiv>\n\n  <section id=\"r5\" data-screen-label=\"05 Ganesh Puja\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"ganesha\" style=\"order: 2;\"><\u002Fdiv>\n        <div style=\"order: 1;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">05<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">The ceremony proper begins<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 10 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Ganesh Puja<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">Removing the obstacles<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(50% 0.015 70); margin: 0 0 18px; text-wrap: pretty;\">I sit at the mandapam and the purohit invokes Ganesha with turmeric, flowers and a lamp. This is where the ceremony itself starts — everything before it was preparation.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Ganesha is asked first before anything that matters. Whatever might go wrong in the next three hours gets cleared out of the way before it can.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The lamp being lit. Once it is burning, we have begun.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r6\" data-screen-label=\"06 Bride's entry and the Tera\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"tera\" style=\"order: 1;\"><\u002Fdiv>\n        <div style=\"order: 2;\">\n          <div>\n            <div>\n              <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n                <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">06<\u002Fspan>\n                <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">Before the muhurta<\u002Fspan>\n                <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 10 min<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">The Bride’s Entry<\u002Fh2>\n              <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">Terasala, the curtain<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 16px; line-height: 1.8; color: oklch(50% 0.015 70); margin: 0 0 14px; text-wrap: pretty;\">Rebecca is brought in and seated across from me — by custom, carried in seated in a basket. A plain cloth curtain, the tera, is held up between us so we cannot see each other.<\u002Fp>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px; margin-bottom: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The curtain stands for two lives that have run separately up to now. It stays up through the next three rituals and comes down at one exact second, later, at the muhurta.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The two people holding the cloth. They have the most important job in the room for the next twenty minutes.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r7\" data-screen-label=\"07 Kanyadaanam\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"kanyadaanam\" style=\"order: 2;\"><\u002Fdiv>\n        <div style=\"order: 1;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">07<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">The handover<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 15 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Kanyadaanam<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">The giving of the bride<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(50% 0.015 70); margin: 0 0 18px; text-wrap: pretty;\">Her hands are placed in mine and water is poured over them, letting it run through. Traditionally my feet are washed first.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">A gift poured out with water cannot be taken back. My feet are washed because for this one morning I am being treated as Vishnu and she as Lakshmi — the god who has come to marry the goddess.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The water running between our hands. Nobody catches it, and that is the point.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 5px;\">Abhi<\u002Fdiv>\n            <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.62; color: oklch(46% 0.02 70); margin: 0; text-wrap: pretty;\">Rebecca had no reason to know any of this, and she learned all of it anyway. Every part of this morning is something she chose rather than inherited. I am not going to forget that.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r8\" data-screen-label=\"08 Panigrahanam\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"panigrahanam\" style=\"order: 1;\"><\u002Fdiv>\n        <div style=\"order: 2;\">\n          <div>\n            <div>\n              <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n                <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">08<\u002Fspan>\n                <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">Immediately after<\u002Fspan>\n                <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 5 min<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Panigrahanam<\u002Fh2>\n              <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">Taking the hand<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 16px; line-height: 1.8; color: oklch(50% 0.015 70); margin: 0 0 14px; text-wrap: pretty;\">I take Rebecca’s hand and repeat a line three times, to her and to the room: <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 17px;\">dharmecha, arthecha, kamecha, mokshecha, nati charami.<\u002Fspan><\u002Fp>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px; margin-bottom: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">It means: in duty, in money, in desire and in the search for release — I will not walk away from her. Said three times so there is no version of a life together it does not cover.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">My hand under hers, not over it. The purohit will correct us if we get it the wrong way round.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r9\" data-screen-label=\"09 Jeelakarra Bellam\" data-dark-section=\"\" style=\"background: oklch(26% 0.115 21); box-shadow: inset 0 0 0 1px oklch(76% 0.12 84 / 0.34), inset 0 1px 0 0 oklch(82% 0.11 86 / 0.5), inset 0 0 70px oklch(64% 0.13 60 / 0.22), inset 0 0 190px oklch(40% 0.13 30 / 0.28);\">\n    <div class=\"rt-wrap\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"jeelakarra\" data-ritual-dark=\"\" style=\"order: 2;\"><\u002Fdiv>\n        <div style=\"order: 1;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(44% 0.05 68);\">09<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(82% 0.11 78); font-weight: 700;\">The moment of the muhurta<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(72% 0.02 78); font-weight: 600;\">About 5 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1; color: oklch(95% 0.014 84); text-shadow: 0 0 26px oklch(74% 0.09 83 / 0.28);\">Jeelakarra Bellam<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(82% 0.1 84); font-weight: 600; margin-bottom: 16px;\">Cumin and jaggery<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(85% 0.018 80); margin: 0 0 18px; text-wrap: pretty;\">A paste of bitter cumin and sweet jaggery is handed to each of us on a betel leaf. At the exact second of the muhurta we reach over the curtain and press it onto each other’s heads. Then the curtain is pulled away, and we see each other.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(60% 0.085 82 / 0.42); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(82% 0.1 84); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(85% 0.018 80);\">Ground together, cumin and jaggery cannot be separated again. In this tradition this is the instant we are married — not the vows, not the thread that gets tied later. Most families count from here.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(60% 0.085 82 / 0.42); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(72% 0.02 78); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(85% 0.018 80);\">This is the photograph. Look down at your phone here and you will miss us getting married. The elders will throw turmeric rice over us straight afterwards.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(60% 0.085 82 / 0.42); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(82% 0.1 84); font-weight: 700; margin-bottom: 5px;\">Abhi<\u002Fdiv>\n            <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.62; color: oklch(89% 0.02 82); margin: 0; text-wrap: pretty;\">Bitter and sweet, pressed together until you cannot pick them apart. Nobody has improved on that in two ingredients.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div data-act=\"\" style=\"max-width: 1160px; margin: 0 auto; padding: 46px 24px 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px;\">\n    <span style=\"flex: none; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">Act III<\u002Fspan>\n    <span style=\"flex: none; font-family: 'Cormorant Garamond', serif; font-size: clamp(22px, 3.2vw, 30px);\">Married, and the rites that follow<\u002Fspan>\n    <span style=\"flex: 1 1 40px; height: 1px; background: oklch(89% 0.02 82);\"><\u002Fspan>\n    <span style=\"flex: none; font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: oklch(62% 0.015 70); font-weight: 600;\">About 10:15 to 11:15<\u002Fspan>\n  <\u002Fdiv>\n\n  <section id=\"r10\" data-screen-label=\"10 Madhuparkam\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"madhuparkam\" style=\"order: 1;\"><\u002Fdiv>\n        <div style=\"order: 2;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">10<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">A change of clothes<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 15 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Madhuparkam<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">White cotton, red borders · and the Sumangalis<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(50% 0.015 70); margin: 0 0 18px; text-wrap: pretty;\">We go out and change into plain white cotton bordered in red — a sari for Rebecca, a dhoti for me, both gifts from the family. Ten married women walk her back in, six carrying turmeric rice and four carrying lamps.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">White for purity, red for strength: the two things a marriage is asked to hold at once. The rice the Sumangalis carry stands for abundance and the lamps for light, and every one of those ten women is in a marriage that has lasted.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The bundles being handed over. Neither of us dresses ourselves for this part, and that is the whole ritual.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r11\" data-screen-label=\"11 Mangalasutra Dharana\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"mangalsutra\" style=\"order: 2;\"><\u002Fdiv>\n        <div style=\"order: 1;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">11<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">The three knots<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 10 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Mangalasutra Dharana<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">Tying the sacred thread<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(50% 0.015 70); margin: 0 0 18px; text-wrap: pretty;\">I tie the mangalsutra at Rebecca’s neck: two gold discs on one turmeric-stained thread, fastened with three knots. In our family my sister ties the third.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Three knots for the three ways a person can be held to something: in thought, in speech and in action — manasa, vacha, karmana. Two discs on one thread, because what is being tied is larger than the two of us.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The drums. They get louder here on purpose, loud enough that nothing inauspicious can be heard over them.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 5px;\">Abhi<\u002Fdiv>\n            <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.62; color: oklch(46% 0.02 70); margin: 0; text-wrap: pretty;\">Three knots and no takebacks. My sister has been practising hers on a shoelace since March.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r12\" data-screen-label=\"12 Talambralu\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"talambralu\" style=\"order: 1;\"><\u002Fdiv>\n        <div style=\"order: 2;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">12<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">Straight after<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 15 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Talambralu<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">The rice showering, then the garlands<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(50% 0.015 70); margin: 0 0 18px; text-wrap: pretty;\">Rice mixed with turmeric and pearls, poured over each other’s heads by the handful, over and over. Then we exchange garlands. This is the ritual with no equivalent anywhere else in South India.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Rice means plenty, and pouring it over each other is a blessing you give instead of receive. It is meant to be undignified. The first thing we do as a married couple is muck about in front of everyone, and that makes the rest of it easier.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Who is winning. Cheering is fine. Taking sides is expected.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 5px;\">Becca<\u002Fdiv>\n            <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.62; color: oklch(46% 0.02 70); margin: 0; text-wrap: pretty;\">I have been told this is a blessing of abundance. I have also seen the video from his cousin’s wedding. I intend to win.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r13\" data-screen-label=\"13 Brahma Mudi\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"brahmamudi\" style=\"order: 2;\"><\u002Fdiv>\n        <div style=\"order: 1;\">\n          <div>\n            <div>\n              <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n                <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">13<\u002Fspan>\n                <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">Right after the rice<\u002Fspan>\n                <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 5 min<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Brahma Mudi<\u002Fh2>\n              <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">The knot, and the black beads<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 16px; line-height: 1.8; color: oklch(50% 0.015 70); margin: 0 0 14px; text-wrap: pretty;\">Betel nuts, dried dates, a turmeric twig and coins are knotted into the end of Rebecca’s sari and into my shawl, and then the two ends are tied to each other by my sister. My uncle and aunt bring a string of black beads for her to wear.<\u002Fp>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px; margin-bottom: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Brahma’s knot is tied by a sister rather than a priest, because what it binds is the household’s obligation to us and ours to it. The black beads are plain protection — against the evil eye, which in this tradition is drawn to exactly this much happiness.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The knot stays tied for everything that follows. We are physically attached to each other for the rest of the morning.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r14\" data-screen-label=\"14 Agni Pradakshina\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"agni\" style=\"order: 1;\"><\u002Fdiv>\n        <div style=\"order: 2;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">14<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">Around the fire<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 15 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Agni Pradakshina<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">Seven turns, tied together<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(50% 0.015 70); margin: 0 0 18px; text-wrap: pretty;\">We circle the homa kunda seven times, still knotted together, while the purohit feeds the fire with ghee.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Agni is the witness. A Hindu marriage needs a witness that cannot be bribed or persuaded to forget, and the fire is the one every vow is spoken in front of. What is said here cannot be unsaid.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The knotted cloth between us. It was tied a few minutes ago and it stays tied to the end.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r15\" data-screen-label=\"15 Saptapadi\" data-dark-section=\"\" style=\"background: oklch(26% 0.115 21); box-shadow: inset 0 0 0 1px oklch(76% 0.12 84 / 0.34), inset 0 1px 0 0 oklch(82% 0.11 86 / 0.5), inset 0 0 70px oklch(64% 0.13 60 / 0.22), inset 0 0 190px oklch(40% 0.13 30 / 0.28);\">\n    <div class=\"rt-wrap\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"saptapadi\" data-ritual-dark=\"\" style=\"order: 2;\"><\u002Fdiv>\n        <div style=\"order: 1;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(44% 0.05 68);\">15<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(82% 0.11 78); font-weight: 700;\">Seven steps, seven vows<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(72% 0.02 78); font-weight: 600;\">About 10 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1; color: oklch(95% 0.014 84); text-shadow: 0 0 26px oklch(74% 0.09 83 / 0.28);\">Saptapadi<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(82% 0.1 84); font-weight: 600; margin-bottom: 16px;\">The seven steps<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(85% 0.018 80); margin: 0 0 18px; text-wrap: pretty;\">Seven small mounds of rice in a line. Rebecca touches each one in turn with her right foot as I guide her, and a vow is spoken over every step: nourishment, strength, prosperity, happiness, children, the seasons, and friendship.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(60% 0.085 82 / 0.42); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(82% 0.1 84); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(85% 0.018 80);\">By the Vedic reckoning the marriage is complete on the seventh step and not before. Seven, because that is the number of things a household actually has to do, and they are named one at a time so neither of us can claim later not to have heard.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(60% 0.085 82 / 0.42); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(72% 0.02 78); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(85% 0.018 80);\">The seventh mound. The purohit names the vow as we reach it, and that one is friendship.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(60% 0.085 82 / 0.42); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(82% 0.1 84); font-weight: 700; margin-bottom: 5px;\">Becca<\u002Fdiv>\n            <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.62; color: oklch(89% 0.02 82); margin: 0; text-wrap: pretty;\">I am the one who does the walking. Nobody thought to mention that until quite recently.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div data-act=\"\" style=\"max-width: 1160px; margin: 0 auto; padding: 46px 24px 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px;\">\n    <span style=\"flex: none; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">Act IV<\u002Fspan>\n    <span style=\"flex: none; font-family: 'Cormorant Garamond', serif; font-size: clamp(22px, 3.2vw, 30px);\">The close<\u002Fspan>\n    <span style=\"flex: 1 1 40px; height: 1px; background: oklch(89% 0.02 82);\"><\u002Fspan>\n    <span style=\"flex: none; font-size: 12px; letter-spacing: 1.4px; text-transform: uppercase; color: oklch(62% 0.015 70); font-weight: 600;\">About 11:15 to noon<\u002Fspan>\n  <\u002Fdiv>\n\n  <section id=\"r16\" data-screen-label=\"16 Sthalipakam\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"toerings\" style=\"order: 1;\"><\u002Fdiv>\n        <div style=\"order: 2;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">16<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">A quiet moment<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 5 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Sthalipakam<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">The silver toe rings<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(50% 0.015 70); margin: 0 0 18px; text-wrap: pretty;\">I kneel and put silver toe rings, mettelu, on Rebecca’s feet — one on the second toe of each.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Silver, not gold, because gold is never worn below the waist. The man has to kneel at her feet to do it. That is why the ritual comes here, at the end, after all the vows.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The rings and the black beads together. From here on, those two things are what say she is married.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r17\" data-screen-label=\"17 Pradhanam\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"pradhanam\" style=\"order: 2;\"><\u002Fdiv>\n        <div style=\"order: 1;\">\n          <div>\n            <div>\n              <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n                <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">17<\u002Fspan>\n                <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">The other funny one<\u002Fspan>\n                <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 10 min<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Pradhanam<\u002Fh2>\n              <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">Fishing for the ring<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 16px; line-height: 1.8; color: oklch(50% 0.015 70); margin: 0 0 14px; text-wrap: pretty;\">A pot of water is set in front of us with a ring dropped in it. We each put a hand in and race for it, three times over. Best of three.<\u002Fp>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px; margin-bottom: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Whoever wins is said to be the one who will run the household. It is a joke, and it is also the first thing the whole room does together once the solemn part is over. Everyone picks a side and shouts.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px;\">\n                <div style=\"font-siz
