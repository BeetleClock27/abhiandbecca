e: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Cheating. There is always cheating.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r18\" data-screen-label=\"18 Arundhati\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"arundhati\" data-ritual-dark=\"\" style=\"order: 1; background: radial-gradient(44% 44% at 50% 48%, oklch(23% 0.02 268) 0%, oklch(22% 0.019 268) 72%, oklch(20% 0.017 268 / 0.96) 86%, oklch(19% 0.016 268 / 0) 93%);\"><\u002Fdiv>\n        <div style=\"order: 2;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">18<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">Pointed north<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 5 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Arundhati Nakshatram<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">The steady star<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(50% 0.015 70); margin: 0 0 18px; text-wrap: pretty;\">We are shown Arundhati, the faint star that sits beside Vasishtha in the handle of the Big Dipper. Ours is a morning wedding, so the purohit will point us north and ask us to take it on faith.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Vasishtha and Arundhati are held up as the couple that never came apart, and their two stars are a double star: close enough that most people cannot separate them by eye. The couple is shown a model rather than told a rule.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">In the model here, the bright star is Vasishtha and the small one holding on beside it is Arundhati. Astronomers call them Mizar and Alcor.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 5px;\">Abhi<\u002Fdiv>\n            <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.62; color: oklch(46% 0.02 70); margin: 0; text-wrap: pretty;\">A star we cannot see, in a direction we are asked to trust. Reasonable enough, for two people who met on the wrong continent.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r19\" data-screen-label=\"19 Ashirvadamu\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"akshintalu\" style=\"order: 2;\"><\u002Fdiv>\n        <div style=\"order: 1;\">\n          <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n            <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">19<\u002Fspan>\n            <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">At the end, your part<\u002Fspan>\n            <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 15 min<\u002Fspan>\n          <\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Ashirvadamu<\u002Fh2>\n          <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">The blessing of the elders, with akshintalu<\u002Fdiv>\n          <p style=\"font-size: 16.5px; line-height: 1.85; color: oklch(50% 0.015 70); margin: 0 0 18px; text-wrap: pretty;\">The purohit chants the closing blessing and then invites everyone in the room to join in. Elders shower turmeric rice — akshintalu — over our heads and bless us by name, and we bow to them.<\u002Fp>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The priest cannot finish a marriage here on his own. It needs the room. Every elder gives their blessing by hand, one at a time, so the marriage is held up by all of you and not only by the two of us.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px; margin-bottom: 16px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Someone handing you rice. Take a pinch, say our names, throw it gently. No queue and no order. That is the whole thing.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 14px;\">\n            <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 5px;\">Abhi &amp; Becca<\u002Fdiv>\n            <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; line-height: 1.62; color: oklch(46% 0.02 70); margin: 0; text-wrap: pretty;\">This is the part we want most. Do not be shy.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"r20\" data-screen-label=\"20 Appagintalu\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80);\">\n      <div class=\"rt-grid\">\n        <div class=\"rt-stage\" data-ritual-object=\"appagintalu\" style=\"order: 1;\"><\u002Fdiv>\n        <div style=\"order: 2;\">\n          <div>\n            <div>\n              <div style=\"display: flex; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 6px;\">\n                <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 54px; line-height: 1; color: oklch(84% 0.05 82);\">20<\u002Fspan>\n                <span style=\"font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700;\">The last thing<\u002Fspan>\n                <span style=\"margin-left: auto; flex: none; font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 600;\">About 10 min<\u002Fspan>\n              <\u002Fdiv>\n              <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(30px, 4.6vw, 44px); margin: 0 0 4px; line-height: 1.1;\">Appagintalu<\u002Fh2>\n              <div style=\"font-size: 12.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 16px;\">The handing over<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <p style=\"font-size: 16px; line-height: 1.8; color: oklch(50% 0.015 70); margin: 0 0 14px; text-wrap: pretty;\">At the very end, the elders who have stood with Rebecca all morning hand her formally into the family, with instructions. Then we all go and eat.<\u002Fp>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px; margin-bottom: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 700; margin-bottom: 4px;\">Why we do it<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Kanyadaanam was the ritual version, said to the gods and the fire. This is the human one, said out loud and to our faces: look after her. It is usually the only point in the morning where somebody cries.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 12px;\">\n                <div style=\"font-size: 10.5px; letter-spacing: 1.6px; text-transform: uppercase; color: oklch(66% 0.015 70); font-weight: 700; margin-bottom: 4px;\">Watch for<\u002Fdiv>\n                <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Give them the room. Then come and find us at lunch.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ showGlossary }}\" hint-placeholder-val=\"{{ true }}\">\n    <section data-screen-label=\"Glossary\">\n      <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 70px;\">\n        <div style=\"text-align: center; margin-bottom: 26px;\">\n          <div style=\"font-size: 13px; letter-spacing: 2.2px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 8px;\">Words You’ll Hear<\u002Fdiv>\n          <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(28px, 6vw, 46px); margin: 0;\">A Small Glossary<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 0 44px; max-width: 920px; margin: 0 auto;\">\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Muhurta<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The astrologically chosen window the marriage has to happen inside. Ours is Tulalagna, 9:15 AM to noon, which is why the morning runs to the minute.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Purohit<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The priest conducting the ceremony. He chants in Sanskrit and explains each step in English as he goes, so you will not be lost.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Mandapam<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The canopied platform we are married under.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Homa kunda<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The square brick pit the sacred fire is built in. Everything in the second half of the morning happens around it.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Tera<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The cloth curtain held between us from her entry until the muhurta. Also called the terasala or addutera.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Akshintalu<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Rice mixed with turmeric, thrown as a blessing. The same rice, poured rather than thrown, is talambralu.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Sumangali<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">A woman whose marriage is intact. Ten of them walk the bride back in after the Madhuparkam.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Grihastha<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">The householder’s stage of life — the one the Kashi Yatra talks me into and the whole morning is about entering.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Prasadam<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Food offered to Krishna first and then served to everyone. Every meal across both days is prasadam, and all of it is vegetarian.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n            <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Hare Krishna<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">How you will be greeted all weekend, by everyone. It works as hello, goodbye and thank you. Saying it back is more than enough.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <section data-screen-label=\"Practical\">\n    <div class=\"rt-wrap\" style=\"border-top: 1px solid oklch(91% 0.012 80); padding-top: 62px; padding-bottom: 20px;\">\n      <div style=\"text-align: center; margin-bottom: 26px;\">\n        <div style=\"font-size: 13px; letter-spacing: 2.2px; text-transform: uppercase; color: oklch(58% 0.09 80); font-weight: 600; margin-bottom: 8px;\">Four Practical Things<\u002Fdiv>\n        <h2 style=\"font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(28px, 6vw, 46px); margin: 0;\">Before You Come In<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 0 44px; max-width: 920px; margin: 0 auto;\">\n        <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">What to wear<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Indian or Western, whatever you already own. Colour is welcome and nothing needs to be new. Shoulders and knees covered inside the temple.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Shoes<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Off at the door, on the racks, for anywhere inside the temple. Socks are a good idea and the floor is warm.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Photographs<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Take as many as you like, all morning. The one moment worth putting the phone down for is the muhurta, and that is for your sake rather than ours.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top: 1px solid oklch(91% 0.012 80); padding: 16px 0;\">\n          <div style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; margin-bottom: 4px;\">Coming and going<\u002Fdiv>\n          <div style=\"font-size: 15px; line-height: 1.7; color: oklch(50% 0.015 70);\">Nobody is counting. Step out for air whenever you like — the quietest stretch is early, before 9:15. Lunch follows straight on from the last ritual.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Close\">\n    <div class=\"rt-wrap\" style=\"text-align: center; padding-top: 30px; padding-bottom: 84px;\">\n      <p style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(20px, 3.4vw, 27px); line-height: 1.6; color: oklch(46% 0.02 70); max-width: 580px; margin: 0 auto 30px; text-wrap: pretty;\">Three hours, twenty small acts, everyone we have in one room on a ridge in West Virginia. Now you know what you are looking at.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;\">\n        <a href=\"index.html\" style=\"display: inline-block; padding: 14px 38px; border: 1px solid oklch(74% 0.09 83); border-radius: 3px; font-size: 13px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 600;\">Back to the wedding site<\u002Fa>\n        <a href=\"/order-of-ceremony\" style=\"display: inline-block; padding: 14px 38px; border: 1px solid oklch(89% 0.02 82); border-radius: 3px; font-size: 13px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 600; color: oklch(50% 0.015 70);\">Printable order of ceremony<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"margin-top: 34px; font-size: 12px; color: oklch(62% 0.015 70);\">Abhishek &amp; Rebecca · September 21, 2026 · ISKCON New Vrindaban<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;rotateSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.16,&quot;min&quot;:0,&quot;max&quot;:0.5,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;darkMoments&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;showRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;showGlossary&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._sync();\n    this._startRsvpCountdown();\n    this._trackHeaderHeight();\n\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const bar = document.getElementById('rt-progress');\n    const sections = Array.prototype.slice.call(document.querySelectorAll('section[id^=\"r\"]'));\n    const rail = Array.prototype.slice.call(document.querySelectorAll('[data-rail]'));\n    const strip = document.querySelector('[data-rt-mrail]');\n    const mrail = Array.prototype.slice.call(document.querySelectorAll('[data-mrail]'));\n\n    /* Reveal matches the wedding site: each line fades and lifts in as it\n       enters the viewport and settles back out as it leaves. Armed only once we\n       know frames are being painted, so a frame that never animates still\n       shows finished copy. */\n    const reveals = [];\n    sections.forEach((s) => {\n      const col = s.querySelector('.rt-grid > div:not(.rt-stage), .rt-lite > div:not(.rt-stage)');\n      if (col) Array.prototype.forEach.call(col.children, (el) => { el.classList.add('rt-reveal'); reveals.push(el); });\n    });\n    const animate = !reduce && document.visibilityState === 'visible';\n    if (animate && reveals.length) {\n      document.documentElement.classList.add('rt-anim');\n      if ('IntersectionObserver' in window) {\n        this._io = new IntersectionObserver((entries) => {\n          entries.forEach((e) => e.target.classList.toggle('rt-in', e.isIntersecting));\n        }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n        reveals.forEach((el) => this._io.observe(el));\n      }\n      /* a host frame that never delivers intersection callbacks would leave the\n         copy hidden: hand it back after a beat */\n      this._revealFallback = setTimeout(() => {\n        if (document.querySelector('.rt-reveal.rt-in')) return;\n        if (this._io) { this._io.disconnect(); this._io = null; }\n        reveals.forEach((el) => el.classList.add('rt-in'));\n      }, 1500);\n    }\n\n    /* Reveal and rail run off scroll position rather than observers: the page\n       lives inside a preview frame where intersection callbacks are unreliable. */\n    const paint = () => {\n      const h = window.innerHeight;\n      let best = null, bd = Infinity;\n      sections.forEach((s) => {\n        const r = s.getBoundingClientRect();\n        const d = Math.abs(r.top + r.height / 2 - h / 2);\n        if (d < bd) { bd = d; best = s; }\n      });\n      if (best && best.id !== this._cur) {\n        this._cur = best.id;\n        /* the ritual you are level with sits a touch forward of the others */\n        sections.forEach((s) => s.classList.toggle('rt-pop', s === best));\n        const n = best.id.slice(1);\n        rail.forEach((a) => {\n          const on = a.getAttribute('data-rail') === n;\n          a.style.color = on ? 'oklch(48% 0.1 80)' : 'oklch(66% 0.015 70)';\n          a.style.fontWeight = on ? '700' : '400';\n          const dash = a.firstElementChild;\n          if (dash) {\n            dash.style.width = on ? '26px' : '14px';\n            dash.style.height = on ? '2px' : '1px';\n            dash.style.background = on ? 'oklch(58% 0.09 80)' : 'oklch(84% 0.02 80)';\n            dash.style.transition = 'all .3s ease';\n          }\n        });\n        mrail.forEach((a) => {\n          const on = a.getAttribute('data-mrail') === n;\n          a.style.color = on ? 'oklch(99% 0.005 85)' : 'oklch(58% 0.02 70)';\n          a.style.background = on ? 'oklch(56% 0.09 80)' : 'transparent';\n          a.style.borderColor = on ? 'oklch(56% 0.09 80)' : 'oklch(90% 0.02 82)';\n          a.style.fontWeight = on ? '700' : '400';\n          /* keep the active pill in view by scrolling the strip itself */\n          if (on && strip && strip.clientWidth) {\n            strip.scrollLeft = Math.max(0, a.offsetLeft - strip.clientWidth / 2 + a.offsetWidth / 2);\n          }\n        });\n      }\n    };\n\n    const drawBar = () => {\n      if (!bar) return;\n      const max = document.documentElement.scrollHeight - window.innerHeight;\n      bar.style.width = (max > 0 ? Math.min(window.scrollY / max, 1) * 100 : 0) + '%';\n    };\n\n    /* A frame loop rather than scroll events: this page is often viewed inside\n       a host frame that swallows them. Throttled to ~11Hz, since it reads the\n       geometry of every section and the 3D objects need the main thread. */\n    let last = 0;\n    const tick = (now) => {\n      if (document.visibilityState === 'visible' && now - last > 88) {\n        last = now;\n        paint();\n        drawBar();\n      }\n      this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n\n    this._onScroll = () => { paint(); drawBar(); };\n    window.addEventListener('resize', this._onScroll, { passive: true });\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n  }\n\n  componentDidUpdate() { this._sync(); }\n\n  /* Props that the page reads outside React: object spin speed, and whether the\n     two big moments keep their dark ground. */\n  _sync() {\n    window.__ritualSpeed = this.props.rotateSpeed != null ? this.props.rotateSpeed : 0.16;\n\n    const dark = this.props.darkMoments !== false;\n    document.querySelectorAll('[data-dark-section]').forEach((s) => {\n      s.style.background = dark ? 'oklch(26% 0.115 21)' : 'transparent';\n      s.style.boxShadow = dark ? 'inset 0 0 0 1px oklch(76% 0.12 84 / 0.34), inset 0 1px 0 0 oklch(82% 0.11 86 / 0.5), inset 0 0 70px oklch(64% 0.13 60 / 0.22), inset 0 0 190px oklch(40% 0.13 30 / 0.28)' : 'none';\n      s.querySelectorAll('h2').forEach((h) => {\n        h.style.color = dark ? 'oklch(95% 0.014 84)' : 'oklch(38% 0.02 70)';\n      });\n      s.querySelectorAll('p, div').forEach((el) => {\n        const c = el.style.color;\n        if (!c) return;\n        if (dark) return;\n        if (c.indexOf('85% 0.018 80') > -1 || c.indexOf('89% 0.02 82') > -1) el.style.color = 'oklch(50% 0.015 70)';\n        else if (c.indexOf('82% 0.1 84') > -1 || c.indexOf('82% 0.11 78') > -1) el.style.color = 'oklch(58% 0.09 80)';\n        else if (c.indexOf('72% 0.02 78') > -1) el.style.color = 'oklch(66% 0.015 70)';\n        else if (c.indexOf('44% 0.05 68') > -1) el.style.color = 'oklch(84% 0.05 82)';\n      });\n      s.querySelectorAll('[style*=\"border-top\"]').forEach((el) => {\n        if (!dark) el.style.borderTopColor = 'oklch(91% 0.012 80)';\n      });\n    });\n  }\n\n  /* the rail strip sits directly under the fixed header; publish the header's\n     real height so no breakpoint needs a magic number */\n  _trackHeaderHeight() {\n    const header = document.querySelector('[data-rt-header]');\n    if (!header) return;\n    const apply = () => {\n      document.documentElement.style.setProperty('--rt-header-h', header.offsetHeight + 'px');\n    };\n    apply();\n    if (window.ResizeObserver) {\n      this._headerRO = new ResizeObserver(apply);\n      this._headerRO.observe(header);\n    } else {\n      this._onHeaderResize = apply;\n      window.addEventListener('resize', apply);\n    }\n  }\n\n  /* same target and format as the wedding site's nav countdown */\n  _startRsvpCountdown() {\n    const el = document.getElementById('rt-countdown');\n    if (!el) return;\n    const target = new Date('2026-09-21T09:15:00-04:00').getTime();\n    const pad = (n) => (n < 10 ? '0' + n : String(n));\n    const tick = () => {\n      const diff = target - Date.now();\n      if (diff <= 0) {\n        el.textContent = 'The Muhurtham has begun';\n        clearInterval(this._rsvpTimer);\n        return;\n      }\n      const days = Math.floor(diff / 86400000);\n      const hours = Math.floor((diff % 86400000) / 3600000);\n      const minutes = Math.floor((diff % 3600000) / 60000);\n      const seconds = Math.floor((diff % 60000) / 1000);\n      el.textContent = days + 'd ' + pad(hours) + 'h ' + pad(minutes) + 'm ' + pad(seconds) + 's';\n    };\n    tick();\n    this._rsvpTimer = setInterval(tick, 1000);\n  }\n\n  componentWillUnmount() {\n    if (this._rsvpTimer) clearInterval(this._rsvpTimer);\n    if (this._headerRO) this._headerRO.disconnect();\n    if (this._onHeaderResize) window.removeEventListener('resize', this._onHeaderResize);\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._io) this._io.disconnect();\n    if (this._revealFallback) clearTimeout(this._revealFallback);\n    if (this._onScroll) {\n      window.removeEventListener('scroll', this._onScroll);\n      window.removeEventListener('resize', this._onScroll);\n    }\n  }\n\n  renderVals() {\n    return {\n      showRail: this.props.showRail !== false,\n      showGlossary: this.props.showGlossary !== false\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
